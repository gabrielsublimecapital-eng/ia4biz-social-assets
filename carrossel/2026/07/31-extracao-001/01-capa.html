<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="extracao.css">
<style>
  .hero {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    height: 580px;
    background: radial-gradient(130% 150% at 50% 0%, #46311C 0%, #2A1D10 44%, #120C07 100%);
    box-shadow: 0 4px 0 rgba(7,17,15,.08);
  }
  .hero .glow {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,150,60,.5) 0%, rgba(240,120,50,.18) 42%, transparent 68%);
  }
  .hero .glow2 {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);
    width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,205,140,.42) 0%, transparent 65%);
    filter: blur(6px);
  }
  .hero img.brain {
    position: absolute; left: 50%; top: 47%; transform: translate(-50%,-50%);
    height: 460px; filter: drop-shadow(0 34px 56px rgba(0,0,0,.6)) drop-shadow(0 0 46px rgba(255,140,50,.35)) saturate(1.15) contrast(1.05);
  }
  .hero img.reflexo {
    position: absolute; left: 50%; top: 47%;
    transform: translate(-50%, 52%) scaleY(-1);
    height: 460px; opacity: .16;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9) 62%, transparent 88%);
    mask-image: linear-gradient(to top, rgba(0,0,0,.9) 62%, transparent 88%);
    filter: blur(2px) saturate(1.1);
  }
  .p { position: absolute; border-radius: 50%; background: #FFB265; filter: blur(1px); }
  .p1 { width: 10px; height: 10px; left: 17%; top: 26%; opacity: .85; }
  .p2 { width: 6px;  height: 6px;  left: 24%; top: 62%; opacity: .6; }
  .p3 { width: 13px; height: 13px; left: 79%; top: 34%; opacity: .8; filter: blur(2px); }
  .p4 { width: 7px;  height: 7px;  left: 72%; top: 66%; opacity: .55; }
  .p5 { width: 5px;  height: 5px;  left: 60%; top: 16%; opacity: .7; }
  .p6 { width: 9px;  height: 9px;  left: 36%; top: 12%; opacity: .5; filter: blur(2px); }

  .selo {
    position: absolute; right: 40px; top: 40px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .selo .disco {
    width: 124px; height: 124px; border-radius: 30px;
    background: linear-gradient(160deg, #E89070 0%, #D97757 46%, #A34E33 100%);
    box-shadow: 0 14px 28px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.5), inset 0 -6px 12px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .selo .disco img { width: 70px; height: 70px; filter: brightness(0) invert(1) drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .selo .assin {
    font-family: 'IBM Plex Mono', monospace; font-size: 19px; letter-spacing: .26em;
    color: rgba(243,239,230,.85); text-transform: uppercase;
    background: rgba(0,0,0,.4); border: 1px solid rgba(243,239,230,.22);
    border-radius: 999px; padding: 8px 18px;
  }
  .hero .rotulo {
    position: absolute; left: 46px; bottom: 38px;
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; letter-spacing: .2em;
    color: #F5A25C; text-transform: uppercase;
  }
  .hero .rotulo small { display:block; font-size: 18px; letter-spacing: .3em; color: rgba(243,239,230,.55); margin-top: 8px; }
</style>
</head>
<body>
<div class="slide"><i class="cb l"></i><i class="cb r"></i>
  <div class="topo">
    <span class="kicker"><span class="tra">—</span>MISSÃO /EXTRAÇÃO</span>
    <span class="indice">01 / 10</span>
  </div>

  <div>
    <h1 style="font-size:73px; white-space:nowrap;">EXTRAIA O CÉREBRO DO<br><span class="az" style="font-size:138px; letter-spacing:-0.01em; line-height:1.2;">FABLE&nbsp;5</span></h1>
    <div class="sub" style="margin-top:16px; margin-bottom:34px;">antes que ele vire preço de API.</div>
  </div>

  <div class="miolo">
    <div class="hero">
      <div class="glow"></div>
      <div class="glow2"></div>
      <img class="reflexo" src="assets/brain2x.png" alt="">
      <img class="brain" src="assets/brain2x.png" alt="">
      <span class="p p1"></span><span class="p p2"></span><span class="p p3"></span>
      <span class="p p4"></span><span class="p p5"></span><span class="p p6"></span>
      <div class="selo">
        <div class="disco"><img src=".media/images/logo_001.svg" alt="Claude"></div>
        <div class="assin">Anthropic</div>
      </div>
      <div class="rotulo">Claude · Fable 5<small>by Anthropic</small></div>
    </div>
  </div>

  <div class="teaser">o teste que decide o que vale extrair <span class="seta">→</span></div>

  <div class="rodape">
    <span class="marca"><span class="chev">»</span><span class="nome">IA4Biz</span><span class="arroba">@ia4bizz</span></span>
    <span class="dir">Arrasta →</span>
  </div>
</div>
</body>
</html>
